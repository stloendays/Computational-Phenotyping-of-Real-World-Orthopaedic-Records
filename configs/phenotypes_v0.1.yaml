precedence_rules:
  - rule: explicit_anatomy_overrides_generic_diagnosis
  - rule: foot_navicular_context_excludes_wrist_scaphoid
  - rule: first_cmc_requires_specific_anatomical_support
  - rule: missing_text_is_not_negative_phenotype
  - rule: outcome_defining_terms_must_not_be_reused_as_predictors
