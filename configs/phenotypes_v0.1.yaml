    - 不连接
    - 不愈合
    - 陈旧性
    - 慢性
    - SNAC
  acute_terms:
    - 新鲜骨折
    - 急性
  procedure_labels:
    fixation:
      - 内固定
      - 螺钉
      - 空心钉
      - screw
    graft:
      - 植骨
      - bone graft
    reconstruction:
      - 重建
      - reconstruction
    fusion:
      - 融合
