      - 截骨
      - osteotomy
    chevron:
      - Chevron
      - chevron
    akin:
      - Akin
      - akin
    scarf:
      - Scarf
      - scarf
    fusion:
      - 融合
      - fusion
      - arthrodesis
    k_wire:
      - 克氏针
      - K-wire
      - Kirschner
    resection:
      - 切除
      - resection
    soft_tissue:
      - 软组织
      - 韧带
      - 肌腱
      - tendon
      - ligament

