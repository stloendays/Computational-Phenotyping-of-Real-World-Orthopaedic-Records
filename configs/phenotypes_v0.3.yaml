version: v0.3
status: frozen_for_anatomy_audit_v0.2
scope: fixed_local_dataset

principles:
  unit_of_analysis: admission_episode
  no_raw_row_as_independent_sample: true
  source_provenance_required: true
  no_future_local_data_assumed: true
  explicit_uncertainty_state_required: true
  public_small_cell_threshold: 5
  public_inference_suppressed_if_small_cell_recoverable: true

hallux_valgus:
  strict_positive_terms:
    - 拇外翻
    - 踇外翻
    - 拇趾外翻
    - 踇趾外翻
    - 拇囊炎
    - 踇囊炎
  supportive_terms: [第一跖趾关节, 内侧突出, 外偏]
  procedure_labels:
    osteotomy: [截骨, osteotomy]
    chevron: [Chevron, chevron]
    akin: [Akin, akin]
    scarf: [Scarf, scarf]
    fusion: [融合, fusion, arthrodesis]
    k_wire: [克氏针, 钢针, K-wire, Kirschner]
    resection: [切除, resection]
    soft_tissue: [软组织, 韧带, 肌腱, 关节囊, 松解, tendon, ligament]
  bilateral_terms: [双足, 双侧, 双拇, 双趾]

scaphoid:
  anatomy_classes: [wrist_scaphoid, foot_navicular, ambiguous]
  strong_wrist_evidence:
    - explicit wrist-to-scaphoid relation within a local text span
    - explicit hand-scaphoid relation such as 左手舟骨
    - scaphoid waist/proximal-pole/distal-pole terminology
    - anatomical-snuffbox context linked to scaphoid
  foot_evidence:
    - 足舟骨
    - 足舟状骨
    - explicit foot/ankle/tarsal context linked to 舟骨
  contextual_wrist_rule:
    requirement:
      - generic scaphoid fracture/nonunion wording
      - explicit wrist context
      - no explicit foot-navicular evidence
  prohibited_shortcuts:
    - standalone character 手 as hand anatomy
    - words such as 手术 or 手法 as hand-anatomy evidence
    - forced positive assignment for unsupported generic 舟骨 wording
  precedence:
    - strong explicit wrist-scaphoid evidence may retain a wrist phenotype in genuine multi-site trauma
    - otherwise explicit foot-navicular evidence is foot_navicular
    - unsupported generic scaphoid wording remains ambiguous
  fixed_candidate_audit:
    candidate_admissions: 88
    deterministic_wrist_scaphoid: 68
    deterministic_foot_navicular: 13
    deterministic_ambiguous: 7
  chronic_nonunion_terms: [骨不连, 不连接, 不愈合, 陈旧性, 陈旧, 慢性, SNAC]
  chronic_nonunion_source_scope:
    include: [主要诊断名称, 主要诊断描述, 其他诊断名称, 其他诊断描述, 主诉, 专科查体]
    exclude: [手术名称, 手术记录内容]
    rationale: avoid_circular_case_definition_when_comparing_treatment
  fixed_wrist_scaphoid_groups:
    established_chronic_or_nonunion: 23
    other_wrist_scaphoid: 45
  procedure_labels:
    internal_fixation: [内固定, 螺钉, 空心钉, 钢针, screw]
    bone_graft: [植骨, 取骨, bone graft]
    reconstruction: [重建, reconstruction]
    fusion: [融合, arthrodesis]
  causal_interpretation: prohibited_without_longitudinal_incident_nonunion_evidence
  calendar_sensitivity:
    primary_consistent_era: 2023-2025

first_cmc_oa:
  strict_positive_terms:
    - 第一腕掌关节炎
    - 第一腕掌关节骨关节炎
    - 第一掌腕关节炎
    - 拇指腕掌关节炎
    - 拇指CMC关节炎
    - 第一CMC关节炎
    - trapeziometacarpal osteoarthritis
  supportive_terms: [大多角骨, 第一掌骨基底, 拇指基底, CMC]
  broad_terms_not_sufficient_alone: [腕关节炎, 腕掌关节炎]
  competing_terms:
    - 桡腕关节炎
    - 尺腕关节炎
    - 类风湿性腕关节炎
    - 痛风性腕关节炎
    - 创伤性腕关节炎
    - 滑膜炎
  procedure_labels:
    trapeziectomy: [大多角骨切除, trapeziectomy]
    tendon_procedure: [肌腱, tendon]
    ligament_procedure: [韧带, ligament]
    arthroplasty: [关节成形, 置换, arthroplasty]
    fusion: [融合, arthrodesis]

precedence_rules:
  - explicit_anatomy_overrides_generic_diagnosis
  - unsupported_generic_scaphoid_is_ambiguous
  - first_cmc_requires_specific_anatomical_support
  - missing_text_is_not_negative_phenotype
  - outcome_defining_terms_must_not_be_reused_as_predictors
  - operative_text_must_not_define_scaphoid_case_status_for_treatment_comparison
