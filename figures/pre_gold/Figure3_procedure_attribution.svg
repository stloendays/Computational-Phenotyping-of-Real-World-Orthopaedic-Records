<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Procedure attribution as a distinct EHR phenotyping problem</title>
<desc id="desc">Three-panel figure separating module availability, target-disease procedure relevance, and procedure-component extraction.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:24px;font-weight:700}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#444}.tiny{font-size:10px;fill:#555}.box{fill:#fff;stroke:#111;stroke-width:1.5}.soft{fill:#f3f3f3;stroke:#777;stroke-width:1.2}.dark{fill:#222;stroke:#111;stroke-width:1.2}.white{fill:#fff}.rule{stroke:#111;stroke-width:1.5;fill:none}</style>
<text x="55" y="50" class="title">Figure 3. Procedure attribution exposes a second hidden EHR error mode</text>
<text x="65" y="105" class="label">A   Why generic procedure keywords can leak across anatomy</text>
<rect x="80" y="150" width="310" height="120" rx="8" class="soft"/><text x="235" y="185" class="label" text-anchor="middle">One admission episode</text><text x="235" y="213" class="small" text-anchor="middle">Target disease + another orthopaedic problem</text><text x="235" y="237" class="small" text-anchor="middle">Detailed note module available</text>
<rect x="500" y="135" width="280" height="85" rx="8" class="box"/><text x="640" y="170" class="label" text-anchor="middle">Target-disease operation</text><text x="640" y="194" class="small" text-anchor="middle">e.g. hallux osteotomy</text>
<rect x="500" y="255" width="280" height="85" rx="8" class="box"/><text x="640" y="290" class="label" text-anchor="middle">Other-anatomy operation</text><text x="640" y="314" class="small" text-anchor="middle">generic terms may overlap</text>
<line x1="395" y1="200" x2="490" y2="178" class="rule"/><polygon points="490,178 482,174 482,182" fill="#111"/><line x1="395" y1="220" x2="490" y2="296" class="rule"/><polygon points="490,296 482,292 482,300" fill="#111"/>
<rect x="885" y="165" width="300" height="120" rx="8" class="dark"/><text x="1035" y="198" class="label white" text-anchor="middle">Relevance gate</text><text x="1035" y="224" class="small white" text-anchor="middle">Does the procedure treat</text><text x="1035" y="244" class="small white" text-anchor="middle">the target study disease?</text>
<line x1="785" y1="178" x2="875" y2="210" class="rule"/><polygon points="875,210 867,206 867,214" fill="#111"/><line x1="785" y1="296" x2="875" y2="245" class="rule"/><polygon points="875,245 867,241 867,249" fill="#111"/>
<rect x="1280" y="165" width="250" height="120" rx="8" class="box"/><text x="1405" y="202" class="label" text-anchor="middle">Only then extract</text><text x="1405" y="228" class="label" text-anchor="middle">procedure components</text><text x="1405" y="252" class="small" text-anchor="middle">(multi-label)</text><line x1="1195" y1="225" x2="1270" y2="225" class="rule"/><polygon points="1270,225 1262,221 1262,229" fill="#111"/>
<text x="65" y="415" class="label">B   Detailed-note module availability versus disease-concordant procedure-note availability</text>
<text x="70" y="495" class="small">Hallux valgus</text><rect x="290" y="475" width="520" height="22" rx="2" class="soft"/><rect x="290" y="505" width="515.4" height="22" rx="2" class="dark"/><text x="825" y="492" class="small">module 114</text><text x="820" y="522" class="small">target-disease 113</text><text x="70" y="540" class="tiny">1 admission not disease-concordant</text>
<text x="70" y="587" class="small">Scaphoid retrieval</text><rect x="290" y="567" width="141.4" height="22" rx="2" class="soft"/><rect x="290" y="597" width="127.7" height="22" rx="2" class="dark"/><text x="446" y="584" class="small">module 31</text><text x="432" y="614" class="small">target-disease 28</text><text x="70" y="632" class="tiny">3 admissions not disease-concordant</text>
<text x="70" y="679" class="small">First-CMC OA</text><rect x="290" y="659" width="82.1" height="22" rx="2" class="soft"/><rect x="290" y="689" width="82.1" height="22" rx="2" class="dark"/><text x="387" y="676" class="small">module 18</text><text x="387" y="706" class="small">target-disease 18</text>
<text x="290" y="755" class="tiny">light = detailed-note module available</text><text x="535" y="755" class="tiny">dark = disease-concordant procedure note</text>
<text x="970" y="415" class="label">C   Prespecified hierarchical evaluation</text>
<rect x="995" y="470" width="500" height="66" rx="8" class="box"/><text x="1015" y="497" class="label">1. Procedure relevance</text><text x="1015" y="520" class="small">yes / no / uncertain</text>
<line x1="1245" y1="538" x2="1245" y2="555" class="rule"/><polygon points="1245,555 1237,551 1237,559" fill="#111"/>
<rect x="995" y="565" width="500" height="66" rx="8" class="box"/><text x="1015" y="592" class="label">2. Components conditional on gold relevance=yes</text><text x="1015" y="615" class="small">Extraction after attribution is known</text>
<line x1="1245" y1="633" x2="1245" y2="650" class="rule"/><polygon points="1245,650 1237,646 1237,654" fill="#111"/>
<rect x="995" y="660" width="500" height="66" rx="8" class="box"/><text x="1015" y="687" class="label">3. End-to-end components</text><text x="1015" y="710" class="small">Relevance and component errors both count</text>
<text x="995" y="785" class="small">This prevents high component F1 from hiding wrong-disease attribution.</text>
<text x="65" y="855" class="tiny">Counts are deterministic audit outputs and remain provisional clinical labels until physician validation.</text>
</svg>
