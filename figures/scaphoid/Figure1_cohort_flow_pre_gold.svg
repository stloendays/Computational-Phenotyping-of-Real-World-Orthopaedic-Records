<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Scaphoid cohort derivation and operative analytic denominator">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}.panel{font-size:22px;font-weight:700}.main{font-size:18px;font-weight:600}.sub{font-size:15px}.small{font-size:13px;fill:#444}.box{fill:#fff;stroke:#222;stroke-width:1.5}.gray{fill:#f2f2f2;stroke:#555;stroke-width:1.2}.dark{fill:#222;stroke:#222;stroke-width:1.2}.white{fill:#fff}.line{stroke:#333;stroke-width:1.4;fill:none}.dash{stroke:#777;stroke-width:1.2;stroke-dasharray:5 4;fill:none}</style>

<text x="40" y="46" class="panel">A</text>
